name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (must match pyproject)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("v")) {
              throw "Release tags must start with v (got: $tag)"
            }
            $version = $tag.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          $tag = "v$version"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "TAG=$tag" -Encoding utf8
          Write-Host "Building PDM $version (tag $tag)"

      - name: Check version consistency
        run: python packaging/check_version.py --expect "$env:VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller pyinstaller-hooks-contrib

      - name: Run tests before release
        run: python -m pytest -q

      - name: Build portable bundles
        shell: cmd
        run: packaging\build.cmd

      - name: Detect signing secret
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Sign portable executables (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "pdm-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          )
          try {
            & "packaging\sign_windows.ps1" `
              -PfxPath $pfx `
              -Password $env:WINDOWS_CERT_PASSWORD `
              -Files @(
                "dist\pdm-gui\pdm-gui.exe",
                "dist\pdm-cli\pdm.exe",
                "dist\pdm-host\pdm-host.exe"
              )
            if ($LASTEXITCODE -ne 0) {
              throw "signing portable executables failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found"
          }
          & $iscc "/DAppVersion=$env:VERSION" "packaging\pdm.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "dist\pdm-setup-$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "installer was not produced: $setup"
          }

      - name: Sign installer (optional)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "pdm-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          )
          try {
            & "packaging\sign_windows.ps1" `
              -PfxPath $pfx `
              -Password $env:WINDOWS_CERT_PASSWORD `
              -Files @("dist\pdm-setup-$env:VERSION.exe")
            if ($LASTEXITCODE -ne 0) {
              throw "signing installer failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Zip portable bundles
        shell: pwsh
        run: |
          foreach ($name in @("pdm-gui", "pdm-cli", "pdm-host")) {
            $source = "dist\$name"
            if (-not (Test-Path -LiteralPath $source)) {
              throw "missing build output: $source"
            }
            $zip = "dist\$name-$env:VERSION-win64.zip"
            Compress-Archive -Path $source -DestinationPath $zip -Force
            Write-Host "created $zip"
          }

      - name: Warn about unsigned artifacts
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::WINDOWS_CERT_PFX_BASE64 is not configured; release artifacts are unsigned and will show SmartScreen warnings."

      - name: Checksums and update manifest
        shell: pwsh
        run: |
          python packaging/make_update_manifest.py `
            --installer "dist\pdm-setup-$env:VERSION.exe" `
            --version "$env:VERSION" `
            --base-url "https://github.com/${{ github.repository }}/releases/download/$env:TAG/" `
            --notes "PDM $env:VERSION" `
            --out "dist\latest.json"
          if ($LASTEXITCODE -ne 0) {
            throw "manifest generation failed"
          }
          $lines = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -match '\.(zip|exe)$' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content -LiteralPath "dist\SHA256SUMS.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdm-${{ env.VERSION }}-win64
          path: |
            dist/*.zip
            dist/*.exe
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath dist -File |
              Where-Object { $_.Name -match '\.(zip|exe)$' } |
              ForEach-Object { $_.FullName }
          ) + @("dist\latest.json", "dist\SHA256SUMS.txt")
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          } else {
            gh release create $env:TAG @assets `
              --title "PDM $env:VERSION" `
              --generate-notes
          }

name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (must match pyproject)"
        required: true
        type: string
      dry_run:
        description: "Build and verify only; do not publish a GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve version
        id: meta
        shell: pwsh
        run: |
          $dryRun = $false
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $dryRun = ("${{ inputs.dry_run }}" -eq "true")
          } else {
            $tag = "${{ github.ref_name }}"
            if (-not $tag.StartsWith("v")) {
              throw "Release tags must start with v (got: $tag)"
            }
            $version = $tag.Substring(1)
            if ($version.EndsWith("-dryrun")) {
              $version = $version.Substring(0, $version.Length - 7)
              $dryRun = $true
            }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          $tag = "v$version"
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "TAG=$tag" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "DRY_RUN=$($dryRun.ToString().ToLower())" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dry_run=$($dryRun.ToString().ToLower())" -Encoding utf8
          Write-Host "Building PDM $version (tag $tag, dry_run=$dryRun)"

      - name: Check version consistency
        run: python packaging/check_version.py --expect "$env:VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller pyinstaller-hooks-contrib

      - name: Run tests before release
        run: python packaging/run_tests.py -q

      - name: Build portable bundles
        shell: cmd
        run: packaging\build.cmd

      - name: Detect signing method
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $method = "none"
          if (
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_TOKEN) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORG) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT) -and
            -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_POLICY)
          ) {
            $method = "signpath"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            $method = "pfx"
          }
          "method=$method" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Signing method: $method"

      - name: Sign portable executables (PFX)
        if: steps.signing.outputs.method == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "pdm-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          )
          try {
            & "packaging\sign_windows.ps1" `
              -PfxPath $pfx `
              -Password $env:WINDOWS_CERT_PASSWORD `
              -Files @(
                "dist\pdm-gui\pdm-gui.exe",
                "dist\pdm-cli\pdm.exe",
                "dist\pdm-host\pdm-host.exe"
              )
            if ($LASTEXITCODE -ne 0) {
              throw "signing portable executables failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Stage unsigned portable executables (SignPath)
        if: steps.signing.outputs.method == 'signpath'
        shell: pwsh
        run: |
          $stage = "unsigned-portable"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "dist\pdm-gui\pdm-gui.exe" "$stage\pdm-gui.exe" -Force
          Copy-Item "dist\pdm-cli\pdm.exe" "$stage\pdm.exe" -Force
          Copy-Item "dist\pdm-host\pdm-host.exe" "$stage\pdm-host.exe" -Force
          Get-ChildItem -LiteralPath $stage -File | Select-Object Name, Length

      - name: Upload unsigned portable executables (SignPath)
        id: upload-portable
        if: steps.signing.outputs.method == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: pdm-portable-unsigned
          path: unsigned-portable/*.exe
          if-no-files-found: error

      - name: Submit portable signing request (SignPath)
        if: steps.signing.outputs.method == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-portable.outputs.artifact-id }}
          output-artifact-directory: signed-portable
          wait-for-completion: true

      - name: Restore signed portable executables
        if: steps.signing.outputs.method == 'signpath'
        shell: pwsh
        run: |
          $signed = @{}
          Get-ChildItem -LiteralPath "signed-portable" -Recurse -File -Filter *.exe |
            ForEach-Object { $signed[$_.Name] = $_.FullName }
          $targets = @{
            "pdm-gui.exe"  = "dist\pdm-gui\pdm-gui.exe"
            "pdm.exe"      = "dist\pdm-cli\pdm.exe"
            "pdm-host.exe" = "dist\pdm-host\pdm-host.exe"
          }
          foreach ($name in $targets.Keys) {
            if (-not $signed.ContainsKey($name)) {
              throw "signed file missing: $name"
            }
            Copy-Item -LiteralPath $signed[$name] -Destination $targets[$name] -Force
            $sig = Get-AuthenticodeSignature -LiteralPath $targets[$name]
            if ($sig.Status -ne "Valid") {
              throw "signature not valid for $($targets[$name]): $($sig.Status)"
            }
            Write-Host "signed: $($targets[$name])"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe not found"
          }
          & $iscc "/DAppVersion=$env:VERSION" "packaging\pdm.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "dist\pdm-setup-$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "installer was not produced: $setup"
          }

      - name: Sign installer (PFX)
        if: steps.signing.outputs.method == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "pdm-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx,
            [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
          )
          try {
            & "packaging\sign_windows.ps1" `
              -PfxPath $pfx `
              -Password $env:WINDOWS_CERT_PASSWORD `
              -Files @("dist\pdm-setup-$env:VERSION.exe")
            if ($LASTEXITCODE -ne 0) {
              throw "signing installer failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Upload unsigned installer (SignPath)
        id: upload-installer
        if: steps.signing.outputs.method == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: pdm-installer-unsigned
          path: dist/pdm-setup-${{ env.VERSION }}.exe
          if-no-files-found: error

      - name: Submit installer signing request (SignPath)
        if: steps.signing.outputs.method == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          output-artifact-directory: signed-installer
          wait-for-completion: true

      - name: Restore signed installer
        if: steps.signing.outputs.method == 'signpath'
        shell: pwsh
        run: |
          $name = "pdm-setup-$env:VERSION.exe"
          $signed = Get-ChildItem -LiteralPath "signed-installer" -Recurse -File -Filter $name |
            Select-Object -First 1
          if (-not $signed) {
            throw "signed installer missing: $name"
          }
          Copy-Item -LiteralPath $signed.FullName -Destination "dist\$name" -Force
          $sig = Get-AuthenticodeSignature -LiteralPath "dist\$name"
          if ($sig.Status -ne "Valid") {
            throw "installer signature not valid: $($sig.Status)"
          }
          Write-Host "signed: dist\$name"

      - name: Verify installer docs
        shell: pwsh
        run: |
          $check = Join-Path $env:RUNNER_TEMP "pdm-install-check"
          Remove-Item -LiteralPath $check -Recurse -Force -ErrorAction SilentlyContinue
          $setup = "dist\pdm-setup-$env:VERSION.exe"
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/DIR=$check", "/TASKS="
          )
          if ($process.ExitCode -ne 0) {
            throw "installer exited $($process.ExitCode)"
          }
          $docs = Join-Path $check "docs"
          $actual = @(
            Get-ChildItem -LiteralPath $docs -File |
              Select-Object -ExpandProperty Name
          )
          if ($actual.Count -ne 17) {
            throw "installer docs count is $($actual.Count), expected 17: $($actual -join ', ')"
          }
          $forbidden = @(
            Get-ChildItem -LiteralPath $docs -File |
              Where-Object {
                $_.Name -match 'HANDOFF|DEVELOPMENT-STATUS|RENAME-STATUS|github-ssh|reverse-engineering|comparison-|public-'
              }
          )
          if ($forbidden.Count -gt 0) {
            throw "internal docs installed: $($forbidden.Name -join ', ')"
          }
          $uninstaller = Join-Path $check "unins000.exe"
          if (Test-Path -LiteralPath $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -Wait -PassThru -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            )
            if ($uninstall.ExitCode -ne 0) {
              throw "uninstaller exited $($uninstall.ExitCode)"
            }
          }
          Remove-Item -LiteralPath $check -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "installer docs verified: $($actual.Count) public files"

      - name: Zip portable bundles
        shell: pwsh
        run: |
          foreach ($name in @("pdm-gui", "pdm-cli", "pdm-host")) {
            $source = "dist\$name"
            if (-not (Test-Path -LiteralPath $source)) {
              throw "missing build output: $source"
            }
            $zip = "dist\$name-$env:VERSION-win64.zip"
            Compress-Archive -Path $source -DestinationPath $zip -Force
            Write-Host "created $zip"
          }

      - name: Warn about unsigned artifacts
        if: steps.signing.outputs.method == 'none'
        shell: pwsh
        run: |
          Write-Host "::warning::No SignPath or PFX signing credentials are configured; release artifacts are unsigned and will show SmartScreen warnings."

      - name: Checksums and update manifest
        shell: pwsh
        run: |
          python packaging/make_update_manifest.py `
            --installer "dist\pdm-setup-$env:VERSION.exe" `
            --version "$env:VERSION" `
            --base-url "https://github.com/${{ github.repository }}/releases/download/$env:TAG/" `
            --notes "PDM $env:VERSION" `
            --out "dist\latest.json"
          if ($LASTEXITCODE -ne 0) {
            throw "manifest generation failed"
          }
          $lines = Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -match '\.(zip|exe)$' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content -LiteralPath "dist\SHA256SUMS.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdm-${{ env.VERSION }}-win64
          path: |
            dist/*.zip
            dist/*.exe
            dist/latest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Dry-run summary
        if: ${{ steps.meta.outputs.dry_run == 'true' }}
        shell: pwsh
        run: |
          Write-Host "Dry run complete: artifacts built and verified; no GitHub Release published."

      - name: Publish GitHub Release
        if: ${{ steps.meta.outputs.dry_run != 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath dist -File |
              Where-Object { $_.Name -match '\.(zip|exe)$' } |
              ForEach-Object { $_.FullName }
          ) + @("dist\latest.json", "dist\SHA256SUMS.txt")
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @assets --clobber
          } else {
            gh release create $env:TAG @assets `
              --title "PDM $env:VERSION" `
              --generate-notes
          }
